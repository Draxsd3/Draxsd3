<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 260" role="img" aria-labelledby="title desc">
  <title id="title">Renan Ramos</title>
  <desc id="desc">Banner em estilo de jornal com o nome Renan Ramos.</desc>

  <defs>
    <filter id="paper" x="-5%" y="-10%" width="110%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency=".75" numOctaves="4" seed="12" result="grain"/>
      <feColorMatrix in="grain" type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 .10"/>
      </feComponentTransfer>
    </filter>
  </defs>

  <rect width="680" height="260" fill="#e9e4d8"/>
  <rect width="680" height="260" fill="#fff" filter="url(#paper)"/>
  <rect x="16" y="16" width="648" height="228" fill="none" stroke="#1b1a18" stroke-width="1.2"/>
  <rect x="23" y="23" width="634" height="214" fill="none" stroke="#1b1a18" stroke-width=".4"/>

  <path d="M48 72H632M48 188H632" stroke="#1b1a18" stroke-width="1.3"/>
  <path d="M48 78H632M48 182H632" stroke="#1b1a18" stroke-width=".35"/>

  <text x="340" y="151" fill="#171614" font-family="Georgia, Times New Roman, serif" font-size="58" font-weight="700" letter-spacing="-1.5" text-anchor="middle">RENAN RAMOS</text>
</svg>