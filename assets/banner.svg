<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 290" role="img" aria-labelledby="title desc">
  <title id="title">Renan Ramos</title>
  <desc id="desc">Banner escuro com folha de papel rasgada, nome Renan Ramos e especialidades em backend, automação e IA.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#080808"/>
      <stop offset="1" stop-color="#141414"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#eeeae1"/>
      <stop offset="1" stop-color="#d8d2c7"/>
    </linearGradient>
    <filter id="texture" x="-5%" y="-10%" width="110%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency=".65" numOctaves="3" seed="8" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 .07"/></feComponentTransfer>
    </filter>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="4" dy="7" stdDeviation="5" flood-color="#000" flood-opacity=".65"/>
    </filter>
  </defs>

  <rect width="680" height="290" rx="4" fill="url(#background)"/>
  <rect width="680" height="290" filter="url(#texture)" opacity=".5"/>

  <g filter="url(#shadow)">
    <path fill="url(#paper)" d="M31 71 43 65l13 7 15-9 14 6 16-8 16 6 16-8 17 6 16-8 16 6 17-8 16 6 17-8 18 6 16-8 17 6 17-8 17 6 18-8 16 6 17-8 17 6 16-8 17 6 16-7 17 6 14-6 9 6v150l-10 5-12-6-14 8-16-7-16 8-17-7-17 8-17-7-17 8-17-7-17 8-17-7-17 8-17-7-18 8-17-7-17 8-17-7-17 8-17-7-17 8-17-7-17 8-17-7-17 8-17-7-16 8-15-7-14 7-11-6z"/>
    <path fill="none" stroke="#bdb6a9" stroke-opacity=".45" d="M55 108h570M55 129h570M55 150h570M55 171h570M55 192h570"/>
  </g>

  <g text-anchor="middle">
    <rect x="267" y="89" width="146" height="27" fill="none" stroke="#8e2424" stroke-width="1.4"/>
    <text x="340" y="107" fill="#8e2424" font-family="Courier New, monospace" font-size="10" letter-spacing="3.5">DRAXSD3 · GITHUB</text>
    <text x="340" y="158" fill="#111" font-family="Georgia, serif" font-size="70" font-weight="700" letter-spacing="-2">RENAN RAMOS</text>
    <text x="340" y="186" fill="#49443d" font-family="Courier New, monospace" font-size="11" letter-spacing="4.7">BACKEND · AUTOMATION · AI</text>
  </g>
</svg>