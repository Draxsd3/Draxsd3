<svg width="100%" viewBox="0 0 1000 210" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Dev Quest</title>
  <desc id="desc">Um painel de mini-game que desafia o visitante a encontrar o bug antes do deploy.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1000" y2="210" gradientUnits="userSpaceOnUse"><stop stop-color="#111827"/><stop offset="1" stop-color="#172554"/></linearGradient>
  </defs>
  <rect width="1000" height="210" rx="18" fill="url(#panel)"/>
  <rect x="31" y="31" width="938" height="148" rx="12" stroke="#334155" stroke-width="2"/>
  <text x="62" y="75" fill="#F8FAFC" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">DEV QUEST</text>
  <text x="62" y="108" fill="#94A3B8" font-family="Arial, Helvetica, sans-serif" font-size="17">Missão: encontre o bug antes do deploy.</text>
  <rect x="62" y="126" width="335" height="24" rx="12" fill="#1E293B"/>
  <rect x="62" y="126" width="247" height="24" rx="12" fill="#22C55E"/>
  <text x="415" y="145" fill="#86EFAC" font-family="monospace" font-size="15">70% pronto</text>
  <g transform="translate(716 61)">
    <rect width="194" height="83" rx="10" fill="#0F172A" stroke="#475569"/>
    <text x="16" y="31" fill="#67E8F9" font-family="monospace" font-size="15">if (ready) {</text>
    <text x="31" y="54" fill="#FBBF24" font-family="monospace" font-size="15">deploy();</text>
    <text x="16" y="76" fill="#67E8F9" font-family="monospace" font-size="15">}</text>
    <circle cx="174" cy="16" r="5" fill="#FB7185"/>
  </g>
  <text x="62" y="168" fill="#A5B4FC" font-family="Arial, Helvetica, sans-serif" font-size="14">Resposta no README ↓</text>
</svg>